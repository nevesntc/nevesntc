name: Refresh public engineering activity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'

permissions: {}

concurrency:
  group: public-engineering-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'nevesntc/nevesntc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh static assets using public repository commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --version
          node --test scripts/activity.test.mjs
          node scripts/update-activity.mjs
      - name: Commit only changed activity assets
        run: |
          git add -- assets/activity.json assets/activity.svg assets/activity-mobile.svg
          if git diff --cached --quiet; then
            echo 'No public project updates.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public project activity'
          git push
