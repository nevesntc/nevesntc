22" fill="#AAB4BE" >entrega</text><rect x="282" y="412" width="230" height="143" rx="8" fill="#151D25" stroke="#202B34"/><text x="296" y="442" font-size="17" fill="#D8B68A" >06</text><text x="296" y="477" font-size="25" fill="#F4F1EB" font-weight="600">Evolution</text><text x="296" y="508" font-size="22" fill="#AAB4BE" >Observar e</text><text x="296" y="533" font-size="22" fill="#AAB4BE" >evoluir</text><text x="28" y="588" font-size="23" fill="#AAB4BE" >Necessidade → decisão → feedback</text></g>
