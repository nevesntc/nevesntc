<title id="title">Engineering mindset</title><desc id="desc">Problem: Entender a necessidade. Design: Definir contratos. Implementation: Implementar regras. Validation: Testar comportamento. Delivery: Automatizar a entrega. Evolution: Observar e evoluir</desc>
